[platformio]
src_dir = src

[env:esp32_becker_serial]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
extra_scripts = pre:extra_script.py
lib_deps =
  tzapu/WiFiManager@2.0.17
build_flags =
  -D SIGNALESP32_BECKER=1
  -D RALF9_BECKER_SERIAL_ONLY=1
  -D RALF9_BECKER_PROFILE=1
